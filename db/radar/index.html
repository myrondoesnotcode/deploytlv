<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Israeli tech companies hiring right now, one per screen, live from their job boards. Free with the Deploy Log."><meta property="og:title" content="Deploy Hiring Radar: who's hiring in Israel right now"><meta property="og:description" content="Israeli tech companies hiring now, one per screen, live from their job boards. Updated daily."><meta property="og:image" content="https://myrondoesnotcode.github.io/hiring-radar/og/radar.png"><meta name="twitter:card" content="summary_large_image"><meta name="robots" content="noindex"></head><body><title>Deploy Hiring Radar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: a full-screen vertical video-style feed (TikTok/Reels): one company per screen, overlay text bottom-left,
   action rail right, tabs on top, nav bar at the bottom. The Discover tab is a light-paper ranking page. Deploy colors. */
:root{
  --paper:#F3EEDF; --ink:#11100D; --orange:#FF5A18; --yellow:#FFD23F;
  --muted:#6B6558; --line:#D9D1BC; --card:#FBF8EF; --lock:#E6DFCB;
  --bg:var(--paper); --fg:var(--ink);
  --feed-bg:#0B0A08; --on-feed:#FFFFFF; --on-feed-dim:rgba(255,255,255,.72); --glass:rgba(255,255,255,.14);
  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --pixel:"Silkscreen","IBM Plex Mono",monospace;
  --nav-h:56px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11100D;--fg:#F3EEDF;--muted:#A39C8A;--line:#2E2B24;--card:#1A1915;--lock:#2A2720;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11100D;--fg:#F3EEDF;--muted:#A39C8A;--line:#2E2B24;--card:#1A1915;--lock:#2A2720;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--feed-bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,th:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.app{position:relative;height:100%;max-width:520px;margin:0 auto;background:var(--feed-bg);overflow:hidden}

/* ---------- FEED ---------- */
#feed{position:absolute;inset:0 0 var(--nav-h);overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;color:var(--on-feed)}
.bgfx{position:absolute;inset:-10%;background:
   radial-gradient(60% 50% at var(--x1,30%) var(--y1,30%), hsl(var(--h) 85% 45% / .85), transparent 70%),
   radial-gradient(50% 45% at var(--x2,80%) var(--y2,70%), hsl(calc(var(--h) + 40) 90% 50% / .6), transparent 70%),
   linear-gradient(160deg, hsl(var(--h) 40% 12%), #0B0A08 70%);
  animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.08) translate(-3%,2%)}}
.mono{position:absolute;right:-6%;top:12%;font-family:var(--display);font-size:62vmin;line-height:.8;color:transparent;
  -webkit-text-stroke:2px rgba(255,255,255,.10);pointer-events:none;user-select:none}
.photo{position:absolute;inset:-12%;background:center/cover no-repeat;filter:blur(26px) brightness(.5) saturate(1.25);animation:drift 14s ease-in-out infinite alternate}
.frame{width:calc(100% + 56px);height:min(calc((min(100vw,520px) - 32px) / 1.91), 28vh);border-radius:14px;overflow:hidden;margin-bottom:12px;
  box-shadow:0 14px 40px rgba(0,0,0,.55);background:#000}
.frame img{display:block;width:100%;height:100%;object-fit:cover;animation:kb 12s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.08)}}
.slide.has-img .center{top:calc(env(safe-area-inset-top,0px) + 58px)}
.slide.has-img .bignum{font-size:clamp(68px,22vw,116px)}
.avatar img,.story .ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#fff;display:block}
.jobs-cta{justify-self:start;display:inline-flex;align-items:center;gap:6px;margin-top:2px;padding:8px 14px;border-radius:999px;background:var(--orange);color:#11100D;font-weight:700;font-size:14px}
.coach{position:absolute;inset:0;z-index:8;background:rgba(0,0,0,.72)}
.coach .tip{position:absolute;color:#fff;font-weight:700;font-size:15px;line-height:1.25;text-align:right;max-width:190px}
.coach .tip small{display:block;font-weight:400;font-size:13px;color:rgba(255,255,255,.75)}
.coach .tip::after{content:"→";position:absolute;right:-26px;top:0;color:var(--orange);font-size:20px}
.coach .ring{position:absolute;border:2px solid var(--orange);border-radius:50%;box-shadow:0 0 0 6px rgba(255,90,24,.25)}
.coach .hand{position:absolute;left:50%;transform:translateX(-50%);display:grid;justify-items:center;gap:6px;text-align:center;color:#fff;font-weight:700}
.coach .hand i{font-style:normal;font-size:34px;animation:swipe 1.4s ease-in-out infinite}
@keyframes swipe{0%{transform:translateY(24px);opacity:0}30%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
.coach .pill{position:absolute;border:2px solid var(--orange);border-radius:999px;box-shadow:0 0 0 6px rgba(255,90,24,.25)}
.coach .cta-tip{position:absolute;color:#fff;font-weight:700;font-size:15px}
.coach .ok{position:absolute;left:16px;padding:11px 26px;border-radius:999px;background:#fff;color:#000;font-weight:700}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,.45) 0, transparent 22%, transparent 45%, rgba(0,0,0,.78) 100%)}
.center{position:absolute;left:0;right:72px;top:20%;padding-left:max(16px,env(safe-area-inset-left,0px));display:grid;gap:6px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-feed-dim)}
.bignum{font-family:var(--display);font-size:clamp(84px,30vw,150px);line-height:.85;color:var(--on-feed);font-variant-numeric:tabular-nums;text-shadow:0 4px 30px rgba(0,0,0,.35)}
.bignum span{color:var(--orange)}
.biglabel{font-weight:700;font-size:17px;max-width:18ch;line-height:1.15}
.statrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.st{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}
.st b{font-variant-numeric:tabular-nums}
.st.lock{border:1px dashed rgba(255,255,255,.5)}
.st.lock b{filter:blur(4px)}
.bottom{position:absolute;left:0;right:76px;bottom:14px;padding-left:max(16px,env(safe-area-inset-left,0px));display:grid;gap:7px}
.handle{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}
.verified{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--orange);color:#11100D;font-size:10px;font-weight:700}
.caption{font-size:14px;line-height:1.35;max-width:36ch}
.caption .tag{font-weight:700}
.more{font-weight:700;color:var(--on-feed-dim)}
.ticker{display:flex;align-items:center;gap:8px;font-size:13px;overflow:hidden;white-space:nowrap}
.ticker .note{flex:none}
.ticker .track{overflow:hidden;mask-image:linear-gradient(90deg,#000 80%,transparent)}
.ticker .run{display:inline-block;padding-left:0;animation:marquee 16s linear infinite}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.rail{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:18px;display:grid;gap:16px;justify-items:center;width:60px}
.avatar{position:relative;width:48px;height:48px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#fff;background:hsl(var(--h) 70% 40%)}
.avatar .plus{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:var(--orange);color:#11100D;font:700 15px/20px var(--body);text-align:center}
.avatar.on .plus{background:#fff}
.act{display:grid;justify-items:center;gap:3px;font-size:12px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.act svg{width:34px;height:34px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
.act.on .heart{fill:#FF2D55;stroke:#FF2D55}
.act.on .book{fill:var(--yellow);stroke:var(--yellow)}
.disc{width:40px;height:40px;border-radius:50%;background:conic-gradient(#222,#555,#222,#555,#222);display:grid;place-items:center;animation:spin 5s linear infinite}
.disc i{width:16px;height:16px;border-radius:50%;background:hsl(var(--h) 70% 50%)}
@keyframes spin{to{transform:rotate(360deg)}}
.burst{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;pointer-events:none;animation:pop .8s ease-out forwards}
.burst svg{width:100%;height:100%;fill:#FF2D55}
@keyframes pop{0%{transform:scale(.3) rotate(-15deg);opacity:0}25%{transform:scale(1.15) rotate(-8deg);opacity:1}60%{transform:scale(1) rotate(-8deg);opacity:1}100%{transform:scale(1.3) translateY(-60px) rotate(-8deg);opacity:0}}

/* intro slide */
.intro .bgfx{--h:18}
.intro .center{top:auto;bottom:120px;right:16px;gap:12px}
.intro h1{font-family:var(--display);font-size:clamp(40px,11vw,62px);line-height:.92;margin:0;text-wrap:balance}
.intro h1 em{font-style:normal;color:var(--orange)}
.howto{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:8px}
.howto li{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.08);font-size:14px;line-height:1.25}
.howto li b{display:block;font-size:15px}
.howto li small{color:var(--on-feed-dim)}
.howto .ic{flex:0 0 34px;height:34px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.14);font-size:17px}
.howto .ic svg{width:19px;height:19px}
.intro p{margin:0;color:var(--on-feed-dim);max-width:40ch}
.stories{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:4px 0}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;display:grid;justify-items:center;gap:4px;width:64px;font-size:11px;color:var(--on-feed)}
.story .ring{width:58px;height:58px;border-radius:50%;padding:2px;background:conic-gradient(var(--orange),var(--yellow),var(--orange))}
.story .ring span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;border:2px solid var(--feed-bg);background:hsl(var(--h) 70% 40%);font-family:var(--display);font-size:20px;box-sizing:border-box}
.story em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:center}
.swipe{font-family:var(--mono);font-size:12px;color:var(--on-feed-dim);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}

/* top tabs */
.top{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:center;gap:18px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:10px;color:#fff;pointer-events:none}
.top > *{pointer-events:auto}
.top .bug{position:absolute;left:max(14px,env(safe-area-inset-left,0px));font-family:var(--pixel);font-size:15px}
.top .bug b{color:var(--orange);font-weight:400}
.top .t{font-weight:700;font-size:16px;color:rgba(255,255,255,.6);padding-bottom:4px;border-bottom:2px solid transparent}
.top .t[aria-selected="true"]{color:#fff;border-bottom-color:#fff}
.top .live{position:absolute;right:max(14px,env(safe-area-inset-right,0px));font-family:var(--mono);font-size:10px;letter-spacing:.08em;background:var(--orange);color:#11100D;border-radius:3px;padding:2px 5px;font-weight:600}
.app.discover .top{display:none}

/* bottom nav */
nav.bar{position:absolute;left:0;right:0;bottom:0;height:var(--nav-h);z-index:4;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  background:#000;border-top:1px solid #222;padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:content-box;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.app{--nav-h:calc(56px + env(safe-area-inset-bottom,0px))}
nav.bar button{display:grid;justify-items:center;gap:2px;font-size:10px;font-weight:600;color:rgba(255,255,255,.6)}
nav.bar button[aria-current="page"]{color:#fff}
nav.bar svg{width:24px;height:24px}
nav.bar .post span{display:grid;place-items:center;width:44px;height:28px;border-radius:8px;background:#fff;color:#000;font-size:22px;font-weight:700;
  box-shadow:-3px 0 0 #25F4EE00, 3px 0 0 var(--orange)}

/* bottom sheet (roles) */
.sheet-bg{position:absolute;inset:0;z-index:6;background:rgba(0,0,0,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;max-height:72%;display:flex;flex-direction:column;background:var(--card);color:var(--fg);
  border-radius:16px 16px 0 0;animation:up .25s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes up{from{transform:translateY(100%)}}
.sheet header{display:flex;align-items:center;justify-content:center;position:relative;padding:14px 16px 10px;font-weight:700;font-size:14px;border-bottom:1px solid var(--line)}
.sheet header button{position:absolute;right:14px;font-size:20px;line-height:1}
.sheet ul{list-style:none;margin:0;padding:6px 0;overflow-y:auto}
.sheet li{display:grid;grid-template-columns:36px 1fr;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.sheet li .ic{width:36px;height:36px;border-radius:50%;background:var(--lock);display:grid;place-items:center;font-family:var(--display);font-size:14px}
.sheet li b{display:block;font-size:14px}
.sheet li small{color:var(--muted);font-size:12px}
.sheet li.locked{filter:blur(3px);pointer-events:none;user-select:none}
.sheet li:has(a.ja){display:block;padding:0}.sheet a.ja{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));color:inherit;text-decoration:none}
.sheet a.ja:active{background:var(--lock)}.sheet a.ja .go{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--orange);white-space:nowrap}
.sheet .unlock{margin:8px 16px 14px;padding:12px;border-radius:999px;background:var(--orange);color:#11100D;font-weight:700;text-align:center}

/* gate */
.gate{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.gate .box{background:var(--card);color:var(--fg);border-radius:16px;padding:22px;max-width:330px;width:100%;display:grid;gap:12px;text-align:center}
.gate h3{font-family:var(--display);font-size:22px;margin:0;line-height:1.05}
.gate p{margin:0;color:var(--muted);font-size:14px}
.gate .note{font-family:var(--mono);font-size:11px;color:var(--muted)}
.lockicon{font-family:var(--pixel);font-size:26px;color:var(--orange)}
.btn{font-weight:700;font-size:15px;border-radius:999px;padding:12px 18px;background:var(--orange);color:#11100D}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:600}
.toast{position:absolute;left:50%;top:40%;transform:translateX(-50%);z-index:9;background:rgba(0,0,0,.8);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;pointer-events:none}

/* ---------- DISCOVER (Explore) ---------- */
#rank{position:absolute;inset:0 0 var(--nav-h);overflow-y:auto;background:var(--feed-bg);color:var(--on-feed)}
.ex{padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.ex-head{position:sticky;top:0;z-index:2;margin:calc(-14px - env(safe-area-inset-top,0px)) -16px 0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;background:linear-gradient(var(--feed-bg) 80%,transparent);display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.search{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:12px;background:var(--glass)}
.search svg{width:18px;height:18px;flex:none;opacity:.7}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;color:#fff;font:inherit;font-size:16px;outline:none}
.search input::placeholder{color:rgba(255,255,255,.55)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--glass);font-size:13px;font-weight:600;white-space:nowrap}
.chip small{font-family:var(--mono);font-weight:400;opacity:.65;margin-left:4px}
.chip[aria-pressed="true"]{background:#fff;color:#000}
.pulse{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-radius:14px;background:rgba(255,255,255,.06);padding:12px 4px}
.pulse div{display:grid;justify-items:center;gap:2px;text-align:center}
.pulse div+div{border-left:1px solid rgba(255,255,255,.1)}
.pulse b{font-family:var(--display);font-size:21px;font-weight:400;font-variant-numeric:tabular-nums}
.pulse b.o{color:var(--orange)}
.pulse span{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--on-feed-dim);line-height:1.2}
.ex h4{display:flex;align-items:baseline;justify-content:space-between;margin:0;font-family:var(--display);font-weight:400;font-size:19px}
.ex h4 small{font-family:var(--mono);font-size:11px;color:var(--on-feed-dim);text-transform:uppercase;letter-spacing:.05em}
.top5{display:grid;gap:4px}
.t5{display:grid;grid-template-columns:30px 44px minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 6px;border-radius:12px;text-align:left;width:100%}
.t5:active{background:rgba(255,255,255,.06)}
.t5 .rk{font-family:var(--display);font-size:24px;color:rgba(255,255,255,.35);text-align:center}
.t5:first-child .rk{color:var(--orange)}
.lg{width:44px;height:44px;border-radius:50%;overflow:hidden;background:hsl(var(--h) 60% 38%);display:grid;place-items:center;font-family:var(--display);font-size:18px}
.lg img{width:100%;height:100%;object-fit:cover;background:#fff}
.t5 b{display:block;font-size:15px}
.t5 small{display:block;font-size:12px;color:var(--on-feed-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t5 .up{font-family:var(--mono);font-weight:600;font-size:14px;color:var(--orange);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;text-align:left;background:linear-gradient(160deg,hsl(var(--h) 65% 32%),hsl(calc(var(--h) + 40) 60% 14%))}
.tile .cvb{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;filter:blur(18px) brightness(.55);transform:scale(1.1)}
.tile .cv{position:absolute;left:8px;right:8px;top:38px;width:calc(100% - 16px);aspect-ratio:1.91/1;object-fit:cover;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.85))}
.tile .badge{position:absolute;top:8px;left:8px;z-index:1;padding:3px 8px;border-radius:999px;background:var(--orange);color:#11100D;font-family:var(--mono);font-size:11px;font-weight:600}
.tile .meta{position:absolute;left:10px;right:10px;bottom:10px;z-index:1;display:grid;gap:6px}
.tile .meta .row{display:flex;align-items:center;gap:8px;min-width:0}
.tile .lg{width:28px;height:28px;flex:none;font-size:12px;border:1.5px solid #fff}
.tile b{font-size:14px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.locked .cv{filter:blur(6px) saturate(.6)}.tile .lki{font-style:normal;font-size:12px;margin-left:auto}
.locked-slide .lk{list-style:none;margin:6px 0 14px;padding:0;display:grid;gap:8px;width:min(100%,340px)}
.locked-slide .lk li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.08);font-size:14px}
.locked-slide .lk li b{font-family:var(--mono);font-size:12px;font-weight:500;opacity:.8;filter:blur(3px)}
.su{position:absolute;inset:0;z-index:60;display:grid;place-items:end center;background:rgba(0,0,0,.55)}
.su .box{width:100%;max-width:440px;background:#F3EEDF;color:#11100D;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));display:grid;gap:12px}
.su h3{margin:0;font-family:"Archivo Black",var(--sans);font-size:22px;line-height:1.1}.su p{margin:0;font-size:14px;line-height:1.45;opacity:.8}
.su input[type=email],.su input[type=text],.su input[inputmode]{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid #11100D;background:#fff;font:inherit;font-size:16px;color:#11100D}
.su input[inputmode]{font-family:var(--mono);font-size:24px;letter-spacing:.35em;text-align:center}
.su label.ck{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}.su label.ck input{margin-top:2px;accent-color:#FF5A18;width:18px;height:18px;flex:none}
.su .go{padding:14px;border-radius:999px;background:#FF5A18;color:#11100D;font-weight:700;font-size:16px}.su .go:disabled{opacity:.6}
.su .lnk{background:none;color:#11100D;text-decoration:underline;font-size:13px;justify-self:center;padding:4px}
.su .err{color:#B42318;font-size:13px}.su .x{position:absolute;right:14px;top:12px;font-size:26px;background:none;color:#11100D;line-height:1}
.su .box{position:relative}.su,.su *{box-sizing:border-box}.su form{min-width:0}
.tile .stat{font-size:12px;color:var(--on-feed-dim)}
.tile .stat em{font-style:normal;color:#fff;font-weight:700}
.tile .match{font-size:11px;color:#fff;background:rgba(255,255,255,.18);border-radius:6px;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk{display:grid;gap:10px;min-width:0}.blk[hidden]{display:none}
.empty{padding:30px 0;text-align:center;color:var(--on-feed-dim)}
.foot{font-size:12px;color:rgba(255,255,255,.5);margin:0}
@media (prefers-reduced-motion: reduce){.coach .hand i,.photo,.frame img,.bgfx,.ticker .run,.disc,.swipe{animation:none}.burst{animation-duration:.01s}}
</style>

<div class="app" id="app">
  <div class="top" role="tablist">
    <span class="bug">DEPLOY<b>.</b></span>
    <button class="t" id="t-follow" role="tab" aria-selected="false">Following</button>
    <button class="t" id="t-fy" role="tab" aria-selected="true">For You</button>
    <span class="live">LIVE</span>
  </div>
  <section id="feed" aria-label="Company feed"></section>
  <section id="rank" hidden aria-label="Discover"></section>
  <nav class="bar" aria-label="Main">
    <button id="n-home" aria-current="page"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>Home</button>
    <button id="n-disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Discover</button>
    <button id="n-post" class="post" data-gate="post"><span>+</span></button>
    <button id="n-alerts" data-gate="alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21h4"/></svg>Alerts</button>
    <button id="n-me" data-gate="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profile</button>
  </nav>
  <div id="layer"></div>
</div>

<script type="text/plain" id="radar-main">
const R = window.__R || null;
const T = R.totals;
const IMG = window.__IMG || {};
// Deploy DB mode (deploytlv.com/db/radar/): R.member is set; non-members get the first 10 in full + locked stubs
const DB = "member" in R, MEMBER = R.member === true;
const C = R.companies.filter(c => c.israel > 0 && !c.locked);
const LOCKED = R.companies.filter(c => c.locked);
const ALL = C.concat(LOCKED);
const FREE = MEMBER ? Infinity : 5, HARD = MEMBER ? Infinity : 10;
const track = (ev, props) => { try { window.RADAR_TRACK && window.RADAR_TRACK(ev, props || {}); } catch (e) {} };
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const shareUrl = c => "https://deploytlv.com/radar/" + slug(c.name) + "/";
const fmt = n => n == null ? "–" : n.toLocaleString("en-US");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hue = s => [...s].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) % 360, 7);
const handle = s => "@" + s.toLowerCase().replace(/[^a-z0-9]+/g, "");
const ago = d => { const n = Math.round((new Date(T.date) - new Date(d)) / 864e5); return n <= 0 ? "today" : n === 1 ? "1d ago" : n < 30 ? n + "d ago" : Math.round(n/30) + "mo ago"; };
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let liked = new Set(store.get("hr-liked", [])), saved = new Set(store.get("hr-saved", [])), followed = new Set(store.get("hr-follow", []));
let unlocked = false, gateShown = false;

const ICON = {
  heart: '<svg viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="1"><path class="heart" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.2 0 3.6 1.2 5.2 3.1 1.6-1.9 3-3.1 5.2-3.1 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>',
  roles: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M9 3h6a2 2 0 0 1 2 2v1h3a2 2 0 0 1 2 2v4H2V8a2 2 0 0 1 2-2h3V5a2 2 0 0 1 2-2zm0 3h6V5H9zM2 13.5h9V15h2v-1.5h9V19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="1"><path class="book" d="M6 3h12v18l-6-4.5L6 21z"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M14 4v4C7 9 4 14 3 20c2.5-3.5 6-5.1 11-5.1V19l7-7.5z"/></svg>',
};

function hookOf(c) { return c.hooks.find(h => !h.startsWith("Top US pay") && !h.includes("posted")) || c.hooks[0] || `${c.israel} open roles in Israel`; }
function tagsOf(c) {
  const city = c.cities[0] && !c.cities[0][0].includes("other") ? c.cities[0][0] : "Israel";
  const t = ["#hiring", "#" + city.replace(/[^A-Za-z]/g, "").toLowerCase()];
  if (c.ai_israel >= 3) t.push("#ai");
  const team = c.teams_israel.map(x => x[0].replace(/[^A-Za-z]/g, "").toLowerCase()).find(x => x && x !== "other" && x.length <= 10);
  if (team) t.push("#" + team);
  return t.join(" ");
}

function slide(c, i) {
  const im = IMG[c.name] || {};
  const h = hue(c.name), pay = c.top_paid ? "$" + Math.round(c.top_paid.max / 1000) + "K" : c.has_pay ? "$···K" : null;
  const roles = c.latest_israel.slice(0, 6).map(j => esc(j.title)).join("  ·  ");
  const bg = im.cover ? `<div class="photo" style="background-image:url(${im.cover})"></div>` : `<div class="bgfx"></div><div class="mono">${esc(c.name[0])}</div>`;
  return `<article class="slide ${im.cover ? "has-img" : ""}" data-i="${i}" data-name="${esc(c.name)}" style="--h:${h};--x1:${20 + h % 40}%;--y1:${25 + h % 30}%">
    ${bg}<div class="shade"></div>
    <div class="center">
      ${im.cover ? `<div class="frame"><img src="${im.cover}" alt="${esc(c.name)}"></div>` : ""}
      <div class="eyebrow">#${i + 1} on the radar · last 30 days</div>
      <div class="bignum" data-count="${c.israel_new30}"><span>+</span>${c.israel_new30}</div>
      <div class="biglabel">new roles in Israel</div>
      <div class="statrow">
        <span class="st"><b>${fmt(c.israel)}</b> open in IL</span>
        <span class="st"><b>${fmt(c.jobs)}</b> worldwide</span>
        ${c.ai_israel ? `<span class="st"><b>${c.ai_israel}</b> AI/ML</span>` : ""}
        ${pay ? (MEMBER ? `<span class="st"><b>${pay}</b> top US pay</span>` : `<button class="st lock" data-gate="pay">US pay <b>${pay}</b></button>`) : ""}
      </div>
    </div>
    <div class="bottom">
      <div class="handle">${handle(c.name)} <span class="verified" title="Live from their public job board">✓</span></div>
      <div class="caption">${esc(hookOf(c))} <span class="tag">${esc(tagsOf(c))}</span></div>
      <button class="jobs-cta" data-act="roles">View ${fmt(c.israel)} open roles ›</button>
      <div class="ticker"><span class="note">♫</span><span class="track"><span class="run">Now hiring: ${roles}  ·  ${roles}  ·  </span></span></div>
    </div>
    <div class="rail">
      <button class="avatar ${followed.has(c.name) ? "on" : ""}" data-act="follow" aria-label="Follow ${esc(c.name)}">${im.logo ? `<img src="${im.logo}" alt="">` : esc(c.name[0])}<span class="plus">${followed.has(c.name) ? "✓" : "+"}</span></button>
      <button class="act ${liked.has(c.name) ? "on" : ""}" data-act="like" aria-label="Like">${ICON.heart}<span>${fmt(c.israel * 37 + (liked.has(c.name) ? 1 : 0))}</span></button>
      <button class="act" data-act="roles" aria-label="Open roles">${ICON.roles}<span>${fmt(c.israel)} jobs</span></button>
      <button class="act ${saved.has(c.name) ? "on" : ""}" data-act="save" aria-label="Save">${ICON.book}<span>Save</span></button>
      <button class="act" data-act="share" aria-label="Share">${ICON.share}<span>Share</span></button>
      <div class="disc" aria-hidden="true"><i></i></div>
    </div>
  </article>`;
}

const today = C.filter(c => c.latest_israel[0] && (new Date(T.date) - new Date(c.latest_israel[0].published)) / 864e5 <= 3);
const feed = document.getElementById("feed");
feed.innerHTML = `<article class="slide intro" data-i="-1" style="--h:18">
    <div class="bgfx"></div><div class="shade"></div>
    <div class="center">
      <div class="eyebrow">Hiring Radar · ${esc(T.date)}</div>
      <div class="stories">${today.slice(0, 12).map(c => `<button class="story" data-jump="${esc(c.name)}" style="--h:${hue(c.name)}"><span class="ring"><span>${IMG[c.name]?.logo ? `<img src="${IMG[c.name].logo}" alt="">` : esc(c.name[0])}</span></span><em>${esc(c.name)}</em></button>`).join("")}</div>
      <h1><em>${fmt(T.israel_new30)}</em> new tech jobs in Israel this month</h1>
      <p>${fmt(T.israel)} open roles across ${T.companies} companies, live from their job boards. ${fmt(T.ai_israel)} are AI/ML.</p>
      <ol class="howto" aria-label="How it works">
        <li><span class="ic">↑</span><span><b>Swipe up</b><small>One hiring company per screen</small></span></li>
        <li><span class="ic">${ICON.roles}</span><span><b>Tap “jobs” to see every open role</b><small>Apply on the company's own site</small></span></li>
        <li><span class="ic">+</span><span><b>Follow a company</b><small>Get an alert when they post new roles</small></span></li>
      </ol>
      <div class="swipe">↑ Swipe up to start</div>
    </div>
  </article>` + C.map(slide).join("") + (LOCKED.length ? `<article class="slide intro locked-slide" data-i="${C.length}" style="--h:24">
    <div class="bgfx"></div><div class="shade"></div>
    <div class="center">
      <div class="eyebrow">Members only</div>
      <h1><em>+${LOCKED.length}</em> more companies hiring</h1>
      <ul class="lk">${LOCKED.slice(0, 6).map(c => `<li><span>${esc(c.name)}</span><b>+${c.israel_new30} new · ${fmt(c.israel)} open</b></li>`).join("")}</ul>
      <button class="jobs-cta" data-gate="hard">Sign up free to see them all ›</button>
    </div>
  </article>` : "");

const layer = document.getElementById("layer");
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; layer.append(t); setTimeout(() => t.remove(), 1400); }
function gate(reason, who) {
  track("gate", {r: reason, c: who && who.name});
  const copy = {
    company: who ? [`See ${who.name}'s open roles`, `${who.name} has ${fmt(who.israel)} open roles in Israel right now. Sign up free to see every company, every role and US pay.`] : null,
    limit: ["Sign up free to keep scrolling", `You've seen ${FREE} companies. Join Deploy for the full feed, US salary ranges and hiring alerts.`],
    hard: ["That's 10 companies", `Sign up free to see all ${ALL.length}, with every open role, US salary ranges and alerts.`],
    pay: ["Salaries are for members", "See the US pay ranges every company posts. It's free."],
    roles: ["See every open role", "Members see all roles, with links to apply. It's free."],
    post: ["Post your company's roles", "Hiring in Israel? Get your jobs into the Deploy feed."],
    alerts: ["Get hiring alerts", "Know the day a company you follow opens new roles."],
    me: ["Your Deploy profile", "Save companies, follow teams and get alerts."],
    follow: ["Follow companies", "Get alerts when they open new roles. It's free."],
  }[reason] || ["Join Deploy", ""];
  layer.innerHTML = `<div class="gate" role="dialog" aria-modal="true" aria-labelledby="g-h"><div class="box">
    <div class="lockicon">[#]</div><h3 id="g-h">${copy[0]}</h3><p id="g-p">${copy[1]}</p>
    <button class="btn" id="g-yes">Sign up free</button>${reason === "hard" ? `<button class="btn ghost" id="g-no">Back to the top</button>` : `<button class="btn ghost" id="g-no">Not now</button>`}
    <div class="note">${window.RADAR_SIGNUP ? "Free with the Deploy Log, Deploy's weekly email." : "Prototype: no account is created."}</div></div></div>`;
  document.getElementById("g-yes").onclick = () => { if (window.RADAR_SIGNUP) return window.RADAR_SIGNUP(reason); document.getElementById("g-p").textContent = "Prototype only: this is where the Deploy signup would open."; };
  document.getElementById("g-no").onclick = () => { layer.innerHTML = ""; if (reason === "limit") unlocked = true; if (reason === "hard") feed.scrollTo({top: 0, behavior: "smooth"}); };
  document.getElementById("g-yes").focus();
}
function sheet(c) {
  const free = MEMBER ? Infinity : 3, more = Math.min(c.locked_roles || 0, 5);
  track("roles", {c: c.name});
  const row = (j, k) => { const inner = `<span class="ic">${esc((j.dept || "R")[0])}</span><span><b>${esc(j.title)}</b><small>${esc(j.dept || "")}${j.dept ? " · " : ""}${esc(j.location)} · ${ago(j.published)}</small></span>`;
    return k >= free ? `<li class="locked">${inner}</li>` : j.url ? `<li><a class="ja" href="${esc(j.url)}" target="_blank" rel="noopener" data-apply="${esc(c.name)}">${inner}<span class="go">Apply ↗</span></a></li>` : `<li>${inner}</li>`; };
  layer.innerHTML = `<div class="sheet-bg" id="s-bg"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Open roles">
    <header>${fmt(c.israel)} open roles in Israel<button id="s-x" aria-label="Close">×</button></header>
    <ul>${c.latest_israel.map(row).join("")}${Array.from({length: more}, (_, k) => `<li class="locked"><span class="ic">·</span><span><b>${["Senior Software Engineer", "Product Manager", "Data Scientist", "DevOps Engineer", "Account Executive"][k]}</b><small>Members only · Israel</small></span></li>`).join("")}</ul>
    ${c.israel > free ? `<button class="unlock" id="s-u">Sign up to see all ${fmt(c.israel)} roles</button>` : ""}</div>`;
  const close = () => layer.innerHTML = "";
  document.getElementById("s-bg").onclick = close; document.getElementById("s-x").onclick = close;
  const u = document.getElementById("s-u"); if (u) u.onclick = () => gate("roles");
  layer.querySelectorAll("[data-apply]").forEach(a => a.onclick = () => track("apply", {c: c.name, t: a.querySelector("b").textContent.slice(0, 80)}));
}
function burst(x, y, el) {
  const b = document.createElement("div"); b.className = "burst"; b.style.left = x + "px"; b.style.top = y + "px";
  b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.2 0 3.6 1.2 5.2 3.1 1.6-1.9 3-3.1 5.2-3.1 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>';
  el.append(b); setTimeout(() => b.remove(), 900);
}
function setLike(slideEl, on) {
  const name = slideEl.dataset.name, btn = slideEl.querySelector('[data-act="like"]'), c = C.find(x => x.name === name);
  on ? liked.add(name) : liked.delete(name); store.set("hr-liked", [...liked]);
  btn.classList.toggle("on", on); btn.querySelector("span").textContent = fmt(c.israel * 37 + (on ? 1 : 0));
}

feed.addEventListener("click", e => {
  const s = e.target.closest(".slide"); if (!s) return;
  const jump = e.target.closest("[data-jump]");
  if (jump) { const t = feed.querySelector(`.slide[data-name="${CSS.escape(jump.dataset.jump)}"]`); if (t) t.scrollIntoView({behavior: "smooth"}); return; }
  const g = e.target.closest("[data-gate]"); if (g) return gate(g.dataset.gate);
  const a = e.target.closest("[data-act]"); if (!a) return;
  const name = s.dataset.name, c = C.find(x => x.name === name);
  if (a.dataset.act === "like") setLike(s, !liked.has(name));
  if (a.dataset.act === "roles") sheet(c);
  if (a.dataset.act === "save") { saved.has(name) ? saved.delete(name) : saved.add(name); store.set("hr-saved", [...saved]); a.classList.toggle("on"); toast(saved.has(name) ? "Saved" : "Removed from saved"); }
  if (a.dataset.act === "follow") { if (!MEMBER && followed.size >= 1 && !followed.has(name)) return gate("follow"); followed.has(name) ? followed.delete(name) : followed.add(name); store.set("hr-follow", [...followed]); track("follow", {c: name, on: followed.has(name)}); if (MEMBER && window.RADAR_FOLLOW) window.RADAR_FOLLOW(name, followed.has(name)); a.classList.toggle("on"); a.querySelector(".plus").textContent = followed.has(name) ? "✓" : "+"; toast(followed.has(name) ? "Following " + name : "Unfollowed"); }
  if (a.dataset.act === "share") { const url = shareUrl(c), txt = `${name} is hiring in Israel: +${c.israel_new30} new roles this month`; track("share", {c: name});
    if (navigator.share) navigator.share({title: name + " on the Deploy Hiring Radar", text: txt, url}).catch(() => {});
    else navigator.clipboard?.writeText(txt + " " + url).then(() => toast("Link copied"), () => toast(url)); }
});
let lastTap = 0;
feed.addEventListener("pointerup", e => {
  const s = e.target.closest(".slide[data-name]"); if (!s || e.target.closest("button")) return;
  const now = Date.now();
  if (now - lastTap < 300) { const r = s.getBoundingClientRect(); burst(e.clientX - r.left, e.clientY - r.top, s); setLike(s, true); lastTap = 0; }
  else lastTap = now;
});

// first-time walkthrough on the first company
function coach(slideEl) {
  store.set("hr-coach", true);
  const box = document.getElementById("app").getBoundingClientRect();
  const at = sel => { const r = slideEl.querySelector(sel).getBoundingClientRect(); return {x: r.left - box.left, y: r.top - box.top, w: r.width, h: r.height}; };
  const cta = at('.jobs-cta'), jobs = at('[data-act="roles"].act'), fol = at('[data-act="follow"]'), like = at('[data-act="like"]');
  const right = box.width - jobs.x + 30, ring = (b, pad = 6) => `<span class="ring" style="left:${b.x - pad}px;top:${b.y - pad}px;width:${b.w + pad * 2}px;height:${b.w + pad * 2}px"></span>`;
  layer.innerHTML = `<div class="coach" role="dialog" aria-label="How it works">
    ${ring(fol)}${ring(like)}${ring(jobs)}
    <div class="tip" style="right:${right}px;top:${fol.y + 4}px">Follow<small>Get an alert when they hire</small></div>
    <div class="tip" style="right:${right}px;top:${like.y + 2}px">Like<small>or double-tap anywhere</small></div>
    <div class="tip" style="right:${right}px;top:${jobs.y + 2}px">See the jobs<small>Every open role in Israel</small></div>
    <span class="pill" style="left:${cta.x - 5}px;top:${cta.y - 5}px;width:${cta.w + 10}px;height:${cta.h + 10}px"></span>
    <div class="cta-tip" style="left:${cta.x}px;top:${cta.y - 34}px">↓ Or tap here to see the jobs</div>
    <div class="hand" style="top:${box.height * .27}px"><i>☝︎</i>Swipe up for the next company</div>
    <button class="ok" id="c-ok" style="top:${jobs.y + jobs.h + 30}px">Got it</button>
  </div>`;
  const close = () => layer.innerHTML = "";
  layer.querySelector(".coach").onclick = close; document.getElementById("c-ok").focus();
}

// count-up + gate after FREE companies
let maxSeen = -1;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  const i = +e.target.dataset.i;
  if (i > maxSeen) { maxSeen = i; if (i === 0 || i % 5 === 0) track("view", {i}); }
  if (i >= HARD) { gate("hard"); }
  else if (i >= FREE && !unlocked && !gateShown) { gateShown = true; gate("limit"); }
  if (i === 0 && !store.get("hr-coach", false)) coach(e.target);
  const n = e.target.querySelector("[data-count]");
  if (n && !n.dataset.done && !reduce) {
    n.dataset.done = 1; const end = +n.dataset.count, t0 = performance.now();
    const step = t => { const p = Math.min(1, (t - t0) / 700); n.innerHTML = "<span>+</span>" + Math.round(end * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
}), {root: feed, threshold: .6});
feed.querySelectorAll(".slide").forEach(el => io.observe(el));

// Following tab: only followed companies
document.getElementById("t-follow").onclick = () => {
  if (!followed.size) return toast("Follow a company with + to see it here");
  document.getElementById("t-follow").setAttribute("aria-selected", true); document.getElementById("t-fy").setAttribute("aria-selected", false);
  feed.querySelectorAll(".slide").forEach(s => s.hidden = !(s.dataset.name && followed.has(s.dataset.name)));

};
document.getElementById("t-fy").onclick = () => {

  feed.querySelectorAll(".slide").forEach(s => s.hidden = false);

// DISCOVER
const app = document.getElementById("app"), rank = document.getElementById("rank");
let exQ = "", exChip = "all";
const SEARCH_ICO = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>';
const logoOf = c => IMG[c.name]?.logo ? `<img src="${IMG[c.name].logo}" alt="">` : esc(c.name[0]);
const CHIPS = [["all", "All", ALL.length], ["new", "🔥 Hiring fast", ALL.filter(c => c.israel_new30 >= 5).length], ["ai", "AI/ML", ALL.filter(c => c.ai_israel > 0).length]]
  .concat(T.teams.filter(([k]) => k !== "Other").slice(0, 5).map(([k, v]) => ["team:" + k, k, v]))
  .concat(T.cities.filter(([k]) => k !== "Israel (other)").slice(0, 4).map(([k, v]) => ["city:" + k, "📍 " + k, v]));
function exFilter() {
  const q = exQ.trim().toLowerCase();
  let rows = ALL.filter(c => {
    if (exChip === "new" && c.israel_new30 < 5) return false;
    if (exChip === "ai" && !c.ai_israel) return false;
    if (exChip.startsWith("team:") && !c.teams_israel.some(([k]) => k === exChip.slice(5))) return false;
    if (exChip.startsWith("city:") && !c.cities.some(([k]) => k === exChip.slice(5))) return false;
    return true;
  }).map(c => {
    let match = null;
    if (q && !c.name.toLowerCase().includes(q)) { match = (c.latest_israel || []).find(j => j.title.toLowerCase().includes(q)); if (!match) return null; }
    return {c, match};
  }).filter(Boolean);
  const key = exChip === "ai" ? "ai_israel" : exChip.startsWith("team:") || exChip.startsWith("city:") ? null : "israel_new30";
  const cnt = c => exChip.startsWith("team:") ? (c.teams_israel.find(([k]) => k === exChip.slice(5)) || [0, 0])[1] : exChip.startsWith("city:") ? (c.cities.find(([k]) => k === exChip.slice(5)) || [0, 0])[1] : c[key];
  rows.sort((a, b) => cnt(b.c) - cnt(a.c) || b.c.israel - a.c.israel);
  return {rows, cnt};
}
function tileHTML({c, match}, cnt) {
  const lbl = exChip === "ai" ? "AI/ML roles" : exChip.startsWith("team:") ? exChip.slice(5) + " roles" : exChip.startsWith("city:") ? "in " + exChip.slice(5) : "jobs in Israel";
  const n = exChip === "all" || exChip === "new" ? c.israel : cnt(c);
  return `<button class="tile${c.locked ? " locked" : ""}" ${c.locked ? 'data-gate="hard"' : `data-jump="${esc(c.name)}"`} style="--h:${hue(c.name)}">
    ${IMG[c.name]?.cover ? `<img class="cvb" src="${IMG[c.name].cover}" alt=""><img class="cv" src="${IMG[c.name].cover}" alt="" loading="lazy">` : ""}
    ${c.israel_new30 ? `<span class="badge">+${c.israel_new30} new</span>` : ""}
    <span class="meta">
      ${match ? `<span class="match">${esc(match.title)}</span>` : ""}
      <span class="row"><span class="lg">${logoOf(c)}</span><b>${esc(c.name)}</b>${c.locked ? '<i class="lki" aria-label="Members only">🔒</i>' : ""}</span>
      <span class="stat"><em>${fmt(n)}</em> ${lbl}</span>
    </span></button>`;
}
function renderGrid() {
  const {rows, cnt} = exFilter();
  const g = rank.querySelector("#ex-grid");
  g.innerHTML = rows.length ? rows.map(r => tileHTML(r, cnt)).join("") : `<p class="empty" style="grid-column:1/-1">Nothing matches “${esc(exQ)}” yet.</p>`;
  rank.querySelector("#ex-count").textContent = `${rows.length} companies`;
  rank.querySelector(".top5-blk").hidden = !!exQ || exChip !== "all";
}
function renderRank() {
  const top = [...ALL].sort((a, b) => b.israel_new30 - a.israel_new30).slice(0, 5);
  rank.innerHTML = `<div class="ex">
    <div class="ex-head">
      <label class="search">${SEARCH_ICO}<input id="ex-q" type="search" placeholder="Search companies or roles" aria-label="Search companies or roles" autocomplete="off"></label>
      <div class="chips" role="group" aria-label="Filter">${CHIPS.map(([k, l, n]) => `<button class="chip" data-chip="${esc(k)}" aria-pressed="${k === exChip}">${esc(l)}<small>${n}</small></button>`).join("")}</div>
    </div>
    <div class="pulse">
      <div><b class="o">${fmt(T.israel_new30)}</b><span>New this month</span></div>
      <div><b>${fmt(T.israel)}</b><span>Open in Israel</span></div>
      <div><b>${fmt(T.companies)}</b><span>Companies</span></div>
      <div><b>${T.israel ? Math.round(T.ai_israel / T.israel * 100) : 0}%</b><span>AI / ML</span></div>
    </div>
    <div class="blk top5-blk"><h4>Hiring fastest <small>Last 30 days</small></h4>
      <div class="top5">${top.map((c, i) => `<button class="t5" ${c.locked ? 'data-gate="hard"' : `data-jump="${esc(c.name)}"`}><span class="rk">${i + 1}</span><span class="lg" style="--h:${hue(c.name)}">${logoOf(c)}</span><span><b>${esc(c.name)}</b><small>${esc(((c.new_teams || [])[0] || ["", 0])[0] ? "Mostly " + c.new_teams[0][0] : fmt(c.israel) + " open in Israel")} · ${fmt(c.israel)} open</small></span><span class="up">+${c.israel_new30}</span></button>`).join("")}</div>
    </div>
    <div class="blk"><h4>Explore <small id="ex-count"></small></h4><div class="grid" id="ex-grid"></div></div>
    <p class="foot">Read directly from each company's public job board. "New this month" uses each role's first-published date. Companies on Comeet or Workday aren't included yet. Logos and images come from each company's own website. Updated ${esc(T.date)}.</p>
  </div>`;
  renderGrid();
  const q = rank.querySelector("#ex-q");
  q.oninput = () => { exQ = q.value; renderGrid(); };
  rank.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    exChip = b.dataset.chip; rank.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b)); renderGrid();
  });
}
rank.addEventListener("click", e => {
  const g = e.target.closest("[data-gate]"); if (g) return gate(g.dataset.gate);
  const j = e.target.closest("[data-jump]"); if (!j) return;
  view("feed");
  const t = feed.querySelector(`.slide[data-name="${CSS.escape(j.dataset.jump)}"]`);
  if (t) requestAnimationFrame(() => t.scrollIntoView());
});
renderRank();
function view(v) {
  const d = v === "discover";
  feed.hidden = d; rank.hidden = !d; app.classList.toggle("discover", d); layer.innerHTML = "";
  document.getElementById("n-home").toggleAttribute("aria-current", !d); document.getElementById("n-disc").toggleAttribute("aria-current", d);
  if (d) document.getElementById("n-disc").setAttribute("aria-current", "page"); else document.getElementById("n-home").setAttribute("aria-current", "page");
  history.replaceState(null, "", d ? "#discover" : "#feed");
}
document.getElementById("n-home").onclick = () => view("feed");
document.getElementById("n-disc").onclick = () => { view("discover"); track("discover"); };
document.querySelectorAll("nav.bar [data-gate]").forEach(b => b.onclick = () => MEMBER && window.RADAR_ACCOUNT ? window.RADAR_ACCOUNT(b.dataset.gate) : gate(b.dataset.gate));
if (location.hash === "#discover") { view("discover"); track("discover"); }
const deep = (location.hash.match(/^#c=([a-z0-9-]+)/) || [])[1];
if (deep) {
  const hit = ALL.find(c => slug(c.name) === deep); track("deeplink", {c: hit ? hit.name : deep});
  if (hit && hit.locked) { store.set("hr-coach", true); gate("company", hit); }
  else if (hit) { store.set("hr-coach", true); requestAnimationFrame(() => feed.querySelector(`.slide[data-name="${CSS.escape(hit.name)}"]`)?.scrollIntoView()); }
}
</script>
<!-- Deploy DB loader for deploytlv.com/db/radar/ (build_page.py puts this after the page; the page's own script is held as text/plain until the data is in).
     Data: Supabase radar_public() for everyone, radar_for_me() once signed in (everything for Deploy Log subscribers).
     Sign-up: the Deploy DB's own flow (email -> 6-digit code or link -> subscribe RPC + beehiiv function), same consent text. -->
<div id="boot" style="position:fixed;inset:0;display:grid;place-items:center;background:#0B0A08;color:#fff;font:600 14px 'IBM Plex Mono',monospace;z-index:99">Loading the Hiring Radar…</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/db/config.js"></script>
<script>
(function () {
  var IMG_BASE = "https://myrondoesnotcode.github.io/hiring-radar/img/";
  var CONSENT = "Yes, send me the Deploy Log weekly email. I can unsubscribe anytime, and my access ends when I do.";
  var C = window.DDB_CONFIG || {}, bootEl = document.getElementById("boot");
  var storage = { getItem: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    setItem: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, removeItem: function (k) { try { localStorage.removeItem(k); } catch (e) {} } };
  if (!window.supabase || !C.url) { bootEl.textContent = "Couldn't load. Refresh the page to try again."; return; }
  var sb = window.supabase.createClient(C.url, C.anonKey, { auth: { storage: storage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "implicit" } });
  var here = location.origin + location.pathname, session = null;
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  /* funnel tracking: anonymous browser id + step name (Supabase radar_track) */
  var sid = storage.getItem("hr-sid"); if (!sid) { sid = Math.random().toString(36).slice(2) + Date.now().toString(36); storage.setItem("hr-sid", sid); }
  function track(ev, props) { sb.rpc("radar_track", { p_sid: sid, p_event: ev, p_props: props || {} }).then(function () {}, function () {}); }
  window.RADAR_TRACK = track;
  window.RADAR_FOLLOW = function (name, on) { if (session) sb.rpc("radar_follow", { p_company: name, p_on: on }).then(function () {}, function () {}); };
  var valid = function (e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); };

  /* same pending-consent record the Deploy DB uses, so a magic link opened at /db/ finishes the sign-up too */
  function savePending(email, name) { storage.setItem("ddb_pending", JSON.stringify({ email: email.toLowerCase(), name: name || "", text: CONSENT, at: Date.now() })); }
  function takePending(email) { var p = null; try { p = JSON.parse(storage.getItem("ddb_pending") || "null"); } catch (e) {} storage.removeItem("ddb_pending");
    return p && p.email === String(email || "").toLowerCase() && Date.now() - p.at < 864e5 ? p : null; }
  function bee(action) { return sb.functions.invoke("beehiiv", { body: { action: action } }).then(function (r) { return r.error ? { error: r.error } : (r.data || {}); }).catch(function (e) { return { error: e }; }); }
  function subscribe(name, text) { return sb.rpc("subscribe", { p_name: name || "", p_consent: true, p_consent_text: text || CONSENT })
    .then(function (r) { if (r.error) return r; return bee("subscribe").then(function () { return r; }); }); }

  function images() {
    return fetch(IMG_BASE + "images.json").then(function (r) { return r.json(); }).then(function (m) {
      var out = {}; Object.keys(m).forEach(function (n) { var e = {}; if (m[n].cover) e.cover = IMG_BASE + m[n].cover; if (m[n].logo) e.logo = IMG_BASE + m[n].logo; out[n] = e; }); return out;
    }).catch(function () { return {}; });
  }
  function data() { return sb.rpc(session ? "radar_for_me" : "radar_public").then(function (r) { if (r.error) throw r.error; return r.data; }); }

  /* after sign-in: member -> reload into the full feed; consent given -> subscribe first; else ask once */
  function afterSignIn() {
    ui("wait");
    return bee("check").then(function () { return sb.rpc("is_member"); }).then(function (r) {
      if (r.error) { ui("email", "We couldn't check your subscription. Try again in a minute."); return; }
      if (r.data) { track("signed_in", { m: true }); return location.reload(); }
      var p = takePending(session.user.email);
      if (p) return subscribe(p.name, p.text).then(function (x) { if (x.error) return ui("sub", "Subscribing didn't work. Try again."); track("subscribed"); location.reload(); });
      ui("sub");
    });
  }

  /* ---------- sign-up sheet ---------- */
  var host = null, sentTo = "";
  function ui(step, err) {
    if (!host) { host = document.createElement("div"); host.className = "su"; host.setAttribute("role", "dialog"); host.setAttribute("aria-modal", "true"); host.setAttribute("aria-labelledby", "su-h"); document.getElementById("app").append(host);
      host.addEventListener("click", function (e) { if (e.target === host || e.target.closest(".x")) close(); }); }
    var E = err ? '<div class="err" role="alert">' + esc(err) + "</div>" : "";
    var X = '<button class="x" aria-label="Close">×</button>';
    var html = {
      email: '<h3 id="su-h">See the whole Radar, free</h3><p>Every company, every open role and US pay ranges. Free with the Deploy Log, Deploy\'s weekly email. Already subscribed? Just enter your email.</p>' +
        '<form id="su-f" novalidate style="display:grid;gap:10px"><input type="email" id="su-e" placeholder="you@email.com" autocomplete="email" aria-label="Email" required>' +
        '<input type="text" id="su-n" placeholder="First name (optional)" autocomplete="given-name" aria-label="First name">' +
        '<label class="ck"><input type="checkbox" id="su-c"><span>' + CONSENT + '</span></label>' + E +
        '<button class="go" id="su-go">Send my code</button></form>',
      code: '<h3 id="su-h">Check your email</h3><p>We sent a 6-digit code to <b>' + esc(sentTo) + '</b>. Type it here, or tap the link in the email.</p>' +
        '<form id="su-k" novalidate style="display:grid;gap:10px"><input id="su-t" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="6-digit code">' + E +
        '<button class="go" id="su-go">Sign in</button></form><button class="lnk" id="su-back">Use a different email</button>',
      sub: '<h3 id="su-h">One step left</h3><p>You\'re signed in as <b>' + esc(session && session.user.email) + '</b>. The full Radar is free for Deploy Log subscribers.</p>' +
        '<label class="ck"><input type="checkbox" id="su-c"><span>' + CONSENT + '</span></label>' + E + '<button class="go" id="su-go">Subscribe and open</button>',
      wait: '<h3 id="su-h">Opening the full Radar…</h3><p>One moment.</p>',
      acct: '<h3 id="su-h">You\'re in</h3><p>Signed in as <b>' + esc(session && session.user.email) + '</b>. Hiring alerts are coming soon.</p>' +
        '<a class="go" href="/db/" style="text-align:center;text-decoration:none">Open the Deploy DB</a><button class="lnk" id="su-out">Sign out</button>'
    }[step];
    host.innerHTML = '<div class="box">' + X + html + "</div>";
    var go = document.getElementById("su-go"), f;
    if (step === "email") {
      f = document.getElementById("su-f"); var em = document.getElementById("su-e"); em.value = sentTo; em.focus();
      f.onsubmit = function (e) { e.preventDefault(); var v = em.value.trim(); if (!valid(v)) return ui("email", "Enter a valid email.");
        var consent = document.getElementById("su-c").checked; if (consent) savePending(v, document.getElementById("su-n").value.trim());
        go.disabled = true; go.textContent = "Sending…";
        sb.auth.signInWithOtp({ email: v, options: { shouldCreateUser: true, emailRedirectTo: here } }).then(function (r) {
          if (r.error) { var m = (r.error.message || "").toLowerCase(); return ui("email", r.error.status === 429 || m.indexOf("rate") > -1 ? "Too many emails sent. Wait a minute, then try again." : "We couldn't send the email: " + r.error.message); }
          sentTo = v; track("code_sent", { consent: consent }); ui("code");
        }); };
    } else if (step === "code") {
      var t = document.getElementById("su-t"); t.focus();
      t.oninput = function () { t.value = t.value.replace(/\D/g, ""); if (t.value.length === 6 && !go.disabled) document.getElementById("su-k").requestSubmit(); };
      document.getElementById("su-back").onclick = function () { ui("email"); };
      document.getElementById("su-k").onsubmit = function (e) { e.preventDefault(); if (t.value.length < 6) return ui("code", "Enter all 6 digits.");
        go.disabled = true; go.textContent = "Checking…";
        sb.auth.verifyOtp({ email: sentTo, token: t.value, type: "email" }).then(function (r) {
          if (r.error || !r.data.session) return ui("code", "That code didn't work. Check it, or ask for a new one with a different email.");
          session = r.data.session; afterSignIn(); }); };
    } else if (step === "sub") {
      go.onclick = function () { if (!document.getElementById("su-c").checked) return ui("sub", "Tick the box to get the Deploy Log, then try again.");
        go.disabled = true; subscribe("", CONSENT).then(function (x) { if (x.error) return ui("sub", "Subscribing didn't work. Try again."); track("subscribed"); location.reload(); }); };
    } else if (step === "acct") {
      document.getElementById("su-out").onclick = function () { sb.auth.signOut().then(function () { location.reload(); }); };
    }
  }
  function close() { if (host) { host.remove(); host = null; } }
  window.RADAR_SIGNUP = function (reason) { var l = document.getElementById("layer"); if (l) l.innerHTML = ""; track("signup_open", { r: reason || "" }); session ? afterSignIn() : ui("email"); };
  window.RADAR_ACCOUNT = function () { ui("acct"); };

  /* ---------- boot ---------- */
  sb.auth.getSession().then(function (r) {
    session = r.data && r.data.session;
    var q = new URLSearchParams(location.search), ref = document.referrer ? new URL(document.referrer).hostname : "";
    track("visit", { src: q.get("utm_source") || q.get("ref") || ref || "direct", c: (location.hash.match(/^#c=([a-z0-9-]+)/) || [])[1] || "" });
    /* members: follows live in the account (radar_follows), so alerts work on any device */
    var follows = session ? sb.rpc("radar_my_follows").then(function (r) { return r.error ? null : r.data; }, function () { return null; }) : Promise.resolve(null);
    return Promise.all([data(), images(), follows]);
  }).then(function (res) {
    if (res[0].member && res[2]) { var local = []; try { local = JSON.parse(storage.getItem("hr-follow") || "[]"); } catch (e) {}
      local.filter(function (n) { return res[2].indexOf(n) < 0; }).forEach(function (n) { window.RADAR_FOLLOW(n, true); res[2].push(n); });
      storage.setItem("hr-follow", JSON.stringify(res[2])); }
    window.__R = res[0]; window.__IMG = res[1];
    var s = document.createElement("script"); s.textContent = document.getElementById("radar-main").textContent; document.body.append(s);
    bootEl.remove();
    /* came back from the email link, or signed in on the Deploy DB but not yet subscribed */
    if (session && !res[0].member && takePendingPeek(session.user.email)) afterSignIn();
  }).catch(function (e) { console.error(e); bootEl.textContent = "Couldn't load the Radar. Refresh to try again."; });
  function takePendingPeek(email) { try { var p = JSON.parse(storage.getItem("ddb_pending") || "null"); return p && p.email === String(email).toLowerCase(); } catch (e) { return false; } }
})();
</script>
