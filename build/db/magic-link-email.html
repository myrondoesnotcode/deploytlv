<!--
Supabase → Authentication → Emails → paste into BOTH "Magic Link" AND "Confirm signup"
(new subscribers get "Confirm signup", returning ones get "Magic Link").
Subject:  Your Deploy DB sign-in code: {{ .Token }}
Body:     paste everything below this comment.
{{ .ConfirmationURL }} and {{ .Token }} are filled in by Supabase. The code lets people sign in on a
different browser or device than the one the email opens in. The link works once and expires (default 1 hour; set 15 min under Auth settings).
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f3eedf;">
<tr><td align="center" style="padding:28px 12px;">
<table role="presentation" width="520" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:520px;background:#fffdf7;border:2px solid #11100d;">
  <tr><td style="background:#ff5a18;border-bottom:2px solid #11100d;padding:7px 14px;font-family:'Courier New',Courier,monospace;font-size:12px;font-weight:bold;color:#11100d;letter-spacing:1px;">SIGN_IN.EXE</td></tr>
  <tr><td style="padding:28px 28px 8px;font-family:'Arial Black',Arial,sans-serif;font-size:30px;line-height:32px;color:#11100d;text-transform:uppercase;letter-spacing:-1px;">Deploy <span style="color:#ff5a18;">DB</span></td></tr>
  <tr><td style="padding:6px 28px 0;font-family:Helvetica,Arial,sans-serif;font-size:16px;line-height:25px;color:#2b2925;">
    Tap the button to sign in to the Deploy DB, or type this code on the sign-in page. Both work once and expire soon.
  </td></tr>
  <tr><td style="padding:18px 28px 0;">
    <div style="display:inline-block;background:#fffdf7;border:2px dashed #11100d;padding:12px 20px;font-family:'Courier New',Courier,monospace;font-size:30px;font-weight:bold;letter-spacing:8px;color:#11100d;">{{ .Token }}</div>
  </td></tr>
  <tr><td style="padding:22px 28px 6px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td style="background:#ff5a18;border:2px solid #11100d;">
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 26px;font-family:Helvetica,Arial,sans-serif;font-size:16px;font-weight:bold;color:#11100d;text-decoration:none;">Sign in to Deploy DB &rarr;</a>
    </td></tr></table>
  </td></tr>
  <tr><td style="padding:16px 28px 26px;font-family:Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#5c554a;">
    Didn't ask for this? You can ignore this email. Nobody can sign in without this link or code.
  </td></tr>
  <tr><td style="background:#11100d;padding:10px 28px;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#d9d5cc;">Deploy TLV &middot; deploytlv.com</td></tr>
</table>
</td></tr>
</table>
